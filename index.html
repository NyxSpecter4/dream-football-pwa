<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1628">
<title>Dream Football</title>
<link rel="manifest" href="manifest.json">
<style>
:root { --bg:#0a1628; --card:#12203a; --ink:#e8eef7; --muted:#8a9bb5; --accent:#f5a623; --green:#3dd68c; --red:#ff5c5c; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; font-size:16px; }
header { padding:16px 20px; display:flex; align-items:center; gap:12px; border-bottom:1px solid #1e2d4a; }
.logo { width:32px; height:32px; background:var(--accent); border-radius:8px; display:flex; align-items:center; justify-content:center; font-weight:700; color:#0a1628; }
h1 { margin:0; font-size:20px; font-weight:600; }
.tabs { display:flex; background:#0d1b30; }
.tab { flex:1; padding:14px 4px; text-align:center; font-size:13px; color:var(--muted); background:none; border:none; border-bottom:2px solid transparent; cursor:pointer; }
.tab.active { color:var(--ink); border-bottom-color:var(--accent); font-weight:600; }
main { padding:16px 20px 90px; max-width:520px; margin:0 auto; }
.card { background:var(--card); border-radius:12px; padding:16px; margin-bottom:12px; }
input { width:100%; padding:12px; border:1px solid #1e2d4a; border-radius:8px; background:#0d1b30; color:var(--ink); font:inherit; }
button.primary { background:var(--accent); color:#0a1628; border:none; padding:12px; border-radius:8px; font:inherit; font-weight:600; width:100%; margin-top:8px; cursor:pointer; }
button.primary:active { opacity:0.9; }
.muted { color:var(--muted); font-size:14px; }
.footer { position:fixed; bottom:0; left:0; right:0; background:#0d1b30; border-top:1px solid #1e2d4a; padding:12px; text-align:center; font-size:12px; color:var(--muted); }
</style>
</head>
<body>
<header>
  <div class="logo">DF</div>
  <h1>Dream Football</h1>
</header>
<nav class="tabs">
  <button class="tab active" data-tab="room">Room</button>
  <button class="tab" data-tab="draft">Draft</button>
  <button class="tab" data-tab="roster">Roster</button>
  <button class="tab" data-tab="standings">Standings</button>
</nav>
<main id="app"></main>
<div class="footer">$301.2M cap · 8 clubs · 4-letter room code</div>
<script src="app.js"></script>
</body>
</html>
